name: Triton Smoke

on:
  workflow_dispatch:
    inputs:
      onnx_url:
        description: Optional ONNX or zipped ONNX SDK URL to test with Triton
        required: false
        default: https://download.openmmlab.com/mmpose/v1/projects/rtmposev1/onnx_sdk/rtmpose-t_simcc-body7_pt-body7_420e-256x192-026a1439_20230504.zip
        type: string
      model_name:
        description: Triton model name; use smolvlm_256m_cpu for the CPU VLM smoke test
        required: false
        default: rtmpose
        type: string

permissions:
  contents: read

env:
  TRITON_IMAGE: nvcr.io/nvidia/tritonserver:24.12-py3

jobs:
  empty-triton-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: ${{ inputs.model_name != 'smolvlm_256m_cpu' && inputs.onnx_url == '' }}
    steps:
      - name: Start published Triton image without ONNX
        run: |
          mkdir -p models-empty
          docker run -d --name triton-empty \
            -p 8000:8000 \
            -v "$PWD/models-empty:/models-empty:ro" \
            "$TRITON_IMAGE" \
            tritonserver --model-repository=/models-empty --strict-readiness=false

          triton_live=0
          for i in $(seq 1 120); do
            if ! docker ps --format '{{.Names}}' | grep -qx triton-empty; then
              echo "Triton container exited before health/live became available."
              docker logs triton-empty || true
              exit 1
            fi
            if curl -fsS http://localhost:8000/v2/health/live; then
              triton_live=1
              break
            fi
            sleep 2
          done
          if [ "${triton_live}" != "1" ]; then
            echo "Triton did not expose health/live before timeout."
            docker ps -a
            docker logs triton-empty || true
            exit 1
          fi
      - name: Stop Triton
        if: always()
        run: docker rm -f triton-empty || true

  onnx-triton-startup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.model_name != 'smolvlm_256m_cpu' && inputs.onnx_url != '' }}
    steps:
      - name: Prepare ONNX model repository
        env:
          RTMPOSE_ONNX_URL: ${{ inputs.onnx_url }}
          POSE_MODEL_NAME: ${{ inputs.model_name }}
        run: |
          set -euo pipefail
          mkdir -p "models-runtime/${POSE_MODEL_NAME}/1" /tmp/rtmpose-download
          wget -O /tmp/rtmpose-download/artifact "${RTMPOSE_ONNX_URL}"

          if echo "${RTMPOSE_ONNX_URL}" | grep -Eiq '\.zip($|[?#])'; then
            mkdir -p /tmp/rtmpose-download/unzipped
            unzip -q /tmp/rtmpose-download/artifact -d /tmp/rtmpose-download/unzipped
            found_onnx="$(find /tmp/rtmpose-download/unzipped -type f -name '*.onnx' | sort | head -n 1 || true)"
            if [ -z "${found_onnx}" ]; then
              echo "No .onnx file found in zipped SDK artifact."
              find /tmp/rtmpose-download/unzipped -maxdepth 5 -type f -print || true
              exit 1
            fi
            cp "${found_onnx}" "models-runtime/${POSE_MODEL_NAME}/1/model.onnx"
          else
            cp /tmp/rtmpose-download/artifact "models-runtime/${POSE_MODEL_NAME}/1/model.onnx"
          fi

          ls -lh "models-runtime/${POSE_MODEL_NAME}/1/model.onnx"
          cat > "models-runtime/${POSE_MODEL_NAME}/config.pbtxt" <<EOF
          name: "${POSE_MODEL_NAME}"
          platform: "onnxruntime_onnx"
          max_batch_size: 0
          EOF
          cat "models-runtime/${POSE_MODEL_NAME}/config.pbtxt"
          find models-runtime -maxdepth 5 -type f -print

      - name: Start published Triton image with ONNX model repository
        env:
          POSE_MODEL_NAME: ${{ inputs.model_name }}
        run: |
          docker run -d --name triton-onnx \
            -p 8000:8000 \
            -v "$PWD/models-runtime:/models-runtime:ro" \
            "$TRITON_IMAGE" \
            tritonserver --model-repository=/models-runtime --strict-readiness=false

          triton_live=0
          for i in $(seq 1 300); do
            if ! docker ps --format '{{.Names}}' | grep -qx triton-onnx; then
              echo "Triton container exited before health/live became available."
              docker ps -a
              docker logs triton-onnx || true
              find models-runtime -maxdepth 5 -type f -print || true
              exit 1
            fi
            if curl -fsS http://localhost:8000/v2/health/live; then
              triton_live=1
              break
            fi
            if [ $((i % 30)) -eq 0 ]; then
              echo "Waiting for Triton health/live... attempt ${i}/300"
              docker logs --tail 80 triton-onnx || true
            fi
            sleep 2
          done

          if [ "${triton_live}" != "1" ]; then
            echo "Triton did not expose health/live before timeout."
            docker ps -a
            docker logs triton-onnx || true
            exit 1
          fi

          curl -fsS http://localhost:8000/v2/models/${POSE_MODEL_NAME}/ready || {
            echo "Triton is live, but model is not ready."
            curl -fsS http://localhost:8000/v2/models/${POSE_MODEL_NAME} || true
            docker logs triton-onnx || true
            exit 1
          }
      - name: Show Triton logs
        if: always()
        run: docker logs triton-onnx || true
      - name: Stop Triton
        if: always()
        run: docker rm -f triton-onnx || true

  vlm-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: ${{ inputs.model_name == 'smolvlm_256m_cpu' }}
    env:
      VLM_MAX_NEW_TOKENS: "8"
      VLM_ORT_THREADS: "2"
    steps:
      - uses: actions/checkout@v4

      - name: Validate VLM Compose configuration
        run: docker compose -f docker-compose.vlm-cpu.yml config > /tmp/vlm-compose.yml

      - name: Build and start CPU VLM Triton
        run: |
          set -euo pipefail
          docker compose -f docker-compose.vlm-cpu.yml up -d --build

      - name: Wait for VLM model readiness
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 600); do
            if ! docker compose -f docker-compose.vlm-cpu.yml ps --status running --services | grep -qx vlm-triton; then
              echo "VLM Triton container exited before model readiness."
              docker compose -f docker-compose.vlm-cpu.yml ps -a
              docker compose -f docker-compose.vlm-cpu.yml logs vlm-triton || true
              exit 1
            fi

            if curl -fsS http://localhost:8100/v2/models/smolvlm_256m_cpu/ready; then
              ready=1
              break
            fi

            if [ $((i % 30)) -eq 0 ]; then
              echo "Waiting for VLM model readiness... attempt ${i}/600"
              docker compose -f docker-compose.vlm-cpu.yml logs --tail 80 vlm-triton || true
            fi
            sleep 2
          done

          if [ "${ready}" != "1" ]; then
            echo "VLM model did not become ready before timeout."
            docker compose -f docker-compose.vlm-cpu.yml logs vlm-triton || true
            exit 1
          fi

      - name: Run end-to-end image inference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          import zlib

          width = 64
          height = 64
          scanline = b"\x00" + (b"\xff\x00\x00" * width)
          raw = scanline * height

          def chunk(kind, data):
              body = kind + data
              return (
                  struct.pack(">I", len(data))
                  + body
                  + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )
          with open("/tmp/vlm-smoke.png", "wb") as file:
              file.write(png)
          PY

          output="$(
            python3 examples/vlm/client.py /tmp/vlm-smoke.png \
              --prompt "Describe this image in a few words."
          )"
          echo "VLM output: ${output}"

          if [ -z "$(printf '%s' "${output}" | tr -d '[:space:]')" ]; then
            echo "VLM returned an empty response."
            exit 1
          fi

      - name: Show VLM Triton logs
        if: always()
        run: docker compose -f docker-compose.vlm-cpu.yml logs vlm-triton || true

      - name: Stop VLM Triton
        if: always()
        run: docker compose -f docker-compose.vlm-cpu.yml down -v || true
