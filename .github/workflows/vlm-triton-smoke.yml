name: VLM Triton Smoke

on:
  workflow_dispatch:
    inputs:
      max_new_tokens:
        description: Maximum tokens generated by the smoke inference
        required: false
        default: "8"
        type: string
      ort_threads:
        description: ONNX Runtime CPU threads
        required: false
        default: "2"
        type: string

permissions:
  contents: read

jobs:
  vlm-cpu-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose -f docker-compose.vlm-cpu.yml config > /tmp/vlm-compose.yml

      - name: Build and start CPU VLM Triton
        env:
          VLM_MAX_NEW_TOKENS: ${{ inputs.max_new_tokens }}
          VLM_ORT_THREADS: ${{ inputs.ort_threads }}
        run: |
          set -euo pipefail
          docker compose -f docker-compose.vlm-cpu.yml up -d --build

      - name: Wait for VLM model readiness
        run: |
          set -euo pipefail
          ready=0
          for i in $(seq 1 600); do
            if ! docker compose -f docker-compose.vlm-cpu.yml ps --status running --services | grep -qx vlm-triton; then
              echo "VLM Triton container exited before model readiness."
              docker compose -f docker-compose.vlm-cpu.yml ps -a
              docker compose -f docker-compose.vlm-cpu.yml logs vlm-triton || true
              exit 1
            fi

            if curl -fsS http://localhost:8100/v2/models/smolvlm_256m_cpu/ready; then
              ready=1
              break
            fi

            if [ $((i % 30)) -eq 0 ]; then
              echo "Waiting for VLM model readiness... attempt ${i}/600"
              docker compose -f docker-compose.vlm-cpu.yml logs --tail 80 vlm-triton || true
            fi
            sleep 2
          done

          if [ "${ready}" != "1" ]; then
            echo "VLM model did not become ready before timeout."
            docker compose -f docker-compose.vlm-cpu.yml logs vlm-triton || true
            exit 1
          fi

      - name: Run end-to-end image inference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          import zlib

          width = 64
          height = 64
          scanline = b"\x00" + (b"\xff\x00\x00" * width)
          raw = scanline * height

          def chunk(kind, data):
              body = kind + data
              return (
                  struct.pack(">I", len(data))
                  + body
                  + struct.pack(">I", zlib.crc32(body) & 0xFFFFFFFF)
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )
          with open("/tmp/vlm-smoke.png", "wb") as file:
              file.write(png)
          PY

          output="$(
            python3 examples/vlm/client.py /tmp/vlm-smoke.png \
              --prompt "Describe this image in a few words."
          )"
          echo "VLM output: ${output}"

          if [ -z "$(printf '%s' "${output}" | tr -d '[:space:]')" ]; then
            echo "VLM returned an empty response."
            exit 1
          fi

      - name: Show VLM Triton logs
        if: always()
        run: docker compose -f docker-compose.vlm-cpu.yml logs vlm-triton || true

      - name: Stop VLM Triton
        if: always()
        run: docker compose -f docker-compose.vlm-cpu.yml down -v || true
